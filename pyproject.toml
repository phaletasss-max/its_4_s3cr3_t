[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "its-4-s3cr3-t"
version = "0.1.0"
description = "Caja de pequeñas herramientas personales, empezando por cifrado de texto."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44,<51",
]

[project.scripts]
secret-tools = "secret_tools.cli:main"

[tool.setuptools.packages.find]
include = ["secret_tools*"]

