name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-executable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Upgrade pip
        run: python -m pip install --upgrade "pip>=26.2.1"
      - name: Install build dependencies
        run: python -m pip install -e ".[build]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: >-
          python -m PyInstaller --onefile --console --clean
          --name its_4_s3cr3_t-windows-x64 run.py
      - name: Smoke test executable
        run: .\dist\its_4_s3cr3_t-windows-x64.exe list
      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = "dist\its_4_s3cr3_t-windows-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLower()
          "$hash  its_4_s3cr3_t-windows-x64.exe" | Set-Content -Encoding ascii "dist\its_4_s3cr3_t-windows-x64.exe.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/its_4_s3cr3_t-windows-x64.exe
            dist/its_4_s3cr3_t-windows-x64.exe.sha256
